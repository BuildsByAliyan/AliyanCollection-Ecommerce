<body data-page="kids" data-category="kids" data-base="../../">

    <noscript>
        <p style="padding:16px;text-align:center;background:#000;color:#fff;font-family:Arial,sans-serif;">
            Please enable JavaScript to browse products and use the shopping cart.
        </p>

    <!-- ===================== HEADER (cart, search, mobile menu, navbar) =====================
         Filled automatically from partials/header.html by js/components/header.js -->
    <div id="site-header"></div>

    <main id="main-content">

        <!-- ===================== CATEGORY HEADER ===================== -->
        <section class="category-header">
            <div class="container">
                <h1>Kids<span class="sr-only">' wear at Aliyan Collection</span></h1>
                <p class="sub-heading">Comfortable, durable and stylish &mdash; filter by condition and price range to find the right fit.</p>
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="../../index.html">Home</a> / <span aria-current="page">Kids</span>
                </nav>
            </div>
        </section>

        <!-- ===================== LISTING ===================== -->
        <section class="category-main-content">
            <div class="container category-content">
                <h2 class="sr-only">Kids' products and filters</h2>

                <!-- ============ Sidebar filters ============ -->
                <aside class="sidebar" aria-label="Product filters">

                    <div class="filter-group">
                        <h3>Categories</h3>
                        <div class="category-list">
                            <a href="mens.html">Men</a>
                            <a href="women.html">Women</a>
                            <a href="kids.html" class="active-category" aria-current="page">Kids</a>
                        </div>
                    </div>

                    <div class="filter-group">
                        <h3>Filter</h3>
                        <div class="filter-checkbox-group">
                            <label>
                                <input type="checkbox" id="filter-on-sale"> Show Only Products On Sale
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <h3>Condition</h3>
                        <div class="filter-checkbox-group" id="condition-filter-group">
                            <label>
                                <input type="checkbox" name="condition" value="new"> New
                            </label>
                            <label>
                                <input type="checkbox" name="condition" value="pre-owned"> Pre-owned
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <h3>Price Range</h3>
                        <div class="price-range-slider">
                            <div class="price-range-display">
                                <span id="min-price-display">$0</span>
                                <span id="max-price-display">$250</span>
                            </div>
                            <!-- min / max / values are adjusted by shop.js to match this category's real prices -->
                            <input type="range" id="min-price-slider" min="0" max="250" value="0" step="1" aria-label="Minimum price">
                            <input type="range" id="max-price-slider" min="0" max="250" value="250" step="1" aria-label="Maximum price">
                        </div>
                    </div>

                    <button type="button" class="btn dark full-width" id="reset-filters">Reset Filters</button>
                </aside>

                <!-- ============ Products ============ -->
                <div class="main-content-area">

                    <div class="toolbar">
                        <div class="toolbar-left">
                            <span id="product-count-display" aria-live="polite">Loading products&hellip;</span>
                            <select name="show-count" id="show-count" aria-label="Products per page">
                                <option value="12">Show 12</option>
                                <option value="24">Show 24</option>
                                <option value="all" selected>Show All</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <div class="column-selector" role="group" aria-label="Grid layout">
                                <button type="button" id="col-list-btn">List View</button>
                                <button type="button" id="col-2-btn">2 Grid</button>
                                <button type="button" id="col-3-btn">3 Grid</button>
                                <button type="button" id="col-4-btn" class="active">4 Grid</button>
                            </div>
                            <select name="sort" id="sort-by" aria-label="Sort products">
                                <option value="default">Default Sorting</option>
                                <option value="price-asc">Price: Low to High</option>
                                <option value="price-desc">Price: High to Low</option>
                                <option value="newest">Newest Arrivals</option>
                                <option value="oldest">Oldest Arrivals</option>
                            </select>
                        </div>
                    </div>

                    <!-- Product cards are rendered here by js/pages/shop.js from js/data/products.js -->
                    <div class="product-grid-listing col-4" id="product-listing-grid"></div>

                    <!-- Shown by shop.js when no product matches the filters -->
                    <div class="no-results" id="no-results" hidden>
                        <p>No products match your filters.</p>
                        <button type="button" class="btn dark" id="no-results-reset">Clear Filters</button>
                    </div>

                </div>
            </div>
        </section>

    </main>
